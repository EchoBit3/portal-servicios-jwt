{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal de Servicios{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'portal/css/portal.css' %}">
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="{% url 'inicio' %}">Portal de Servicios</a>
    {% if username %}
      <nav class="sesion">
        <span class="usuario">{{ nombre }} <small>@{{ username }}</small></span>
        <a class="boton-secundario" href="{% url 'logout' %}">Salir</a>
      </nav>
    {% endif %}
  </header>

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    Portal de Servicios
  </footer>
</body>
</html>
