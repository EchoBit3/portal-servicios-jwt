{% extends "portal/base.html" %}

{% block titulo %}Ingresar · Portal de Servicios{% endblock %}

{% block contenido %}
<section class="tarjeta-login">
  <h1>Iniciar sesión</h1>
  <p class="ayuda">Las credenciales se validan en la API del Proyecto 1.</p>

  {% if error %}
    <p class="alerta" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}" autocomplete="off">
    {% csrf_token %}
    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" value="{{ username|default:'' }}" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required>

    <button type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
